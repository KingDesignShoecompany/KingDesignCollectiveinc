version: '3.8'

# KingDesignCollectiveINC Corporation — n8n + Aura Services Layer
# These services complement the already-running multiagent stack
# (ollama:11435, proxy:8002, api:8001, web:3000)
# OpenClaw gateway runs on host:18789
services:

  n8n:
    image: n8nio/n8n:latest
    container_name: kingdesigncollectiveinc_n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_storage:/home/node/.n8n
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_BASIC_AUTH_ACTIVE: false
      WEBHOOK_URL: http://localhost:5678
      DATABASE_TYPE: sqlite
      DATA_DIR: /home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:18-alpine
    container_name: aura-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: aura_champions
      POSTGRES_USER: aura_user
      POSTGRES_PASSWORD: aura_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura_user -d aura_champions"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  aura-backend:
    image: node:20-alpine
    container_name: aura-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      PORT: 3000
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_NAME: aura
      DB_USER: aura
      DB_PASS: HMKR6l0pAWWBgImPr_KErfw5ai0XAMtd8QycXo8SShU
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:8b
      JWT_SECRET: "kingdesigncollectiveinc-aura-jwt-secret"
      HMAC_MASTER_SECRET: "4fgEnKlbAYEUhztz4bL3F4w3Iupaa5MAlbg7YgV3ktokXGTnFLbGSvqFu7ZebeFf"
      AUDIT_SIGNING_SECRET: "kingdesigncollectiveinc-aura-audit-secret"
      WRITE_TOKEN_SECRET: "kingdesigncollectiveinc-aura-wt-secret"
      NONCE_TTL_SECONDS: 45
    working_dir: /app
    volumes:
      - "./hermes_skills/aura-backend-master:/app:rw"
    command: sh -c "node src/app.js"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  aura-anti-cheat:
    image: node:20-alpine
    container_name: aura-anti-cheat
    restart: unless-stopped
    depends_on:
      - aura-backend
    ports:
      - "127.0.0.1:3101:3001"
    environment:
      PORT: 3001
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_NAME: aura
      DB_USER: aura
      DB_PASS: HMKR6l0pAWWBgImPr_KErfw5ai0XAMtd8QycXo8SShU
      BACKEND_URL: http://host.docker.internal:3100
      HMAC_MASTER_SECRET: "4fgEnKlbAYEUhztz4bL3F4w3Iupaa5MAlbg7YgV3ktokXGTnFLbGSvqFu7ZebeFf"
      JWT_SECRET: "kingdesigncollectiveinc-aura-jwt-secret"
      AUDIT_SIGNING_SECRET: "kingdesigncollectiveinc-aura-audit-secret"
      NONCE_TTL_SECONDS: 45
    working_dir: /app
    volumes:
      - "./hermes_skills/aura-anti-cheat:/app:rw"
    command: sh -c "node src/app.js"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  aura-trinity:
    image: node:20-alpine
    container_name: aura-trinity
    restart: unless-stopped
    depends_on:
      - aura-backend
    ports:
      - "127.0.0.1:3102:3002"
    environment:
      PORT: 3002
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_NAME: aura
      DB_USER: aura
      DB_PASS: HMKR6l0pAWWBgImPr_KErfw5ai0XAMtd8QycXo8SShU
      BACKEND_URL: http://host.docker.internal:3100
      HMAC_MASTER_SECRET: "4fgEnKlbAYEUhztz4bL3F4w3Iupaa5MAlbg7YgV3ktokXGTnFLbGSvqFu7ZebeFf"
      JWT_SECRET: "kingdesigncollectiveinc-aura-jwt-secret"
    working_dir: /app
    volumes:
      - "./hermes_skills/aura-trinity-special:/app:rw"
    command: sh -c "node src/app.js"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  aura-tournament:
    image: node:20-alpine
    container_name: aura-tournament
    restart: unless-stopped
    depends_on:
      - aura-backend
    ports:
      - "127.0.0.1:3103:3003"
    environment:
      PORT: 3003
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_NAME: aura
      DB_USER: aura
      DB_PASS: HMKR6l0pAWWBgImPr_KErfw5ai0XAMtd8QycXo8SShU
      BACKEND_URL: http://host.docker.internal:3100
      HMAC_MASTER_SECRET: "4fgEnKlbAYEUhztz4bL3F4w3Iupaa5MAlbg7YgV3ktokXGTnFLbGSvqFu7ZebeFf"
      JWT_SECRET: "kingdesigncollectiveinc-aura-jwt-secret"
      AUDIT_SIGNING_SECRET: "kingdesigncollectiveinc-aura-audit-secret"
    working_dir: /app
    volumes:
      - "./hermes_skills/aura-tournament-admin:/app:rw"
    command: sh -c "node src/app.js"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  aura-nfc:
    image: node:20-alpine
    container_name: aura-nfc
    restart: unless-stopped
    depends_on:
      - aura-backend
    ports:
      - "127.0.0.1:3104:4000"
    environment:
      PORT: 4000
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_NAME: aura
      DB_USER: aura
      DB_PASS: HMKR6l0pAWWBgImPr_KErfw5ai0XAMtd8QycXo8SShU
      BACKEND_URL: http://host.docker.internal:3100
      WRITE_TOKEN_SECRET: "kingdesigncollectiveinc-aura-wt-secret"
      TOKEN_TTL_SECONDS: "30"
    working_dir: /app
    volumes:
      - "./hermes_skills/aura-nfc-handler/server:/app:rw"
    command: sh -c "node write_token_service.js"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────
  # VAGARY WORLD MAP: stdlib http.server API (B4)
  # app.py resolves rasters via BASE.parent/"batch_output"; inside the
  # container BASE=/app, so batch_output is mounted at /batch_output.
  # ─────────────────────────────────────────────────────────
  vagary-api:
    build: ./vagary_index/api
    container_name: vagary-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3105:8080"
      # 8080 also mapped so the deployed map's default API base
      # (http://localhost:8080) reaches the container with no config.
      - "127.0.0.1:8080:8080"
    working_dir: /app
    volumes:
      - ./vagary_index/api:/app:rw
      - ./vagary_index/batch_output:/batch_output:rw
      - ./vagary_index/country_roster_master.json:/country_roster_master.json:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  n8n_storage:
  postgres_data:
