<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Design Collective Inc - Travel Index</title>
    <link rel="stylesheet" href="styles/KingDesignCollectiveINC-ui.css">
    <link rel="stylesheet" href="styles/KingDesignCollectiveINC-travel-index.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="homepage.css">
    <link rel="stylesheet" href="shop-responsive.css">
</head>
<body class="KingDesignCollectiveINC-travel-index">
    <header class="travel-header">
        <div class="container">
            <div class="logo-container">
                <img src="images/valgary-index-logo.png" alt="The Vagary Index" class="vagary-logo">
            </div>
            <h1 class="brand-name">The Vagary Index</h1>
            <p class="brand-tagline">250 Countries | Travel Intelligence Platform</p>
        </div>
    </header>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-logo">VAGARY</a>
            <div class="nav-links">
                <a href="index.html" class="active">Dashboard</a>
                <a href="countries.html">Countries</a>
                <a href="country.html">Country</a>
                <a href="shop.html">Shop</a>
            </div>
            <button id="mobile-menu-toggle" class="mobile-menu-btn" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <!-- Hero Carousel -->
    <section class="hero-carousel-container">
        <div class="hero-carousel">
            <div class="carousel-slides" id="hero-slides">
                <!-- Slides loaded by homepage.js -->
            </div>
            <button class="carousel-btn prev" id="carousel-prev" aria-label="Previous">‹</button>
            <button class="carousel-btn next" id="carousel-next" aria-label="Next">›</button>
            <div class="carousel-dots" id="carousel-dots"></div>
        </div>
    </section>

    <!-- Globe + Bundles -->
    <section class="section">
        <div class="container">
            <h2 class="section-title">Global Travel Bundles</h2>
            <div class="globe-container">
                <canvas id="globe-canvas" width="500" height="280"></canvas>
                <div id="globe-tooltip" class="globe-tooltip"></div>
                <div id="bundle-list" class="bundle-list"></div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 The Vagary Index | 250 Countries | Local-Compute Mesh | No Cloud APIs</p>
            <p>Bolt.diy: localhost:5173 | Ollama: localhost:11435 | PostgreSQL: localhost:5432</p>
        </div>
    </footer>

    <script src="scripts/KingDesignCollectiveINC-ui.js" defer></script>
    <script src="scripts/KingDesignCollectiveINC-travel-index.js" defer></script>
    <script src="homepage.js"></script>
    <script src="responsive.js"></script>
</body>
</html>
