name: deploy-gooniversity

# Deploy the standalone Gooniversity static site from gooniversity/webapp/
# to a dedicated gh-pages-gooniversity branch, separate from KDC.
#
# Trigger: push to main when gooniversity/webapp/** or this workflow changes.

on:
  push:
    branches: [main]
    paths:
      - 'gooniversity/webapp/**'
      - '.github/workflows/deploy-gooniversity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare Gooniversity static export
        run: |
          mkdir -p /tmp/gooniversity-pages
          cp -r gooniversity/webapp/* /tmp/gooniversity-pages/
          # Ensure index.html exists
          test -f /tmp/gooniversity-pages/index.html || (echo "Missing index.html" && exit 1)

      - name: Deploy to gh-pages-gooniversity
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/gooniversity-pages
          publish_branch: gh-pages-gooniversity
          force_orphan: true
          user_name: 'KingDesign Shoe Company'
          user_email: 'king@kingdesigncompany.com'
