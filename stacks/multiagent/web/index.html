<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Multi-Agent System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            height: 600px;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .status {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            background: #f5f5f5;
            font-size: 12px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
        }
        
        .status-dot.loading {
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }
        
        .message {
            margin-bottom: 15px;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            text-align: right;
        }
        
        .message.user .content {
            background: #667eea;
            color: white;
            margin-left: 40px;
        }
        
        .message.agent .content {
            background: #e8e8e8;
            color: #333;
            margin-right: 40px;
        }
        
        .content {
            display: inline-block;
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 100%;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.4;
        }
        
        .input-area {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            background: white;
            display: flex;
            gap: 10px;
        }
        
        .input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .input-area input:focus {
            border-color: #667eea;
        }
        
        .input-area button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }
        
        .input-area button:hover {
            background: #5568d3;
        }
        
        .input-area button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .loading-indicator {
            text-align: center;
            color: #999;
            font-size: 12px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Local Multi-Agent</h1>
            <p>Powered by LangChain + Ollama</p>
        </div>
        
        <div class="status">
            <div class="status-item">
                <div class="status-dot" id="ollama-status"></div>
                <span>Ollama: <span id="ollama-text">checking...</span></span>
            </div>
            <div class="status-item">
                <div class="status-dot" id="agent-status"></div>
                <span>Agent: <span id="agent-text">checking...</span></span>
            </div>
            <div class="status-item">
                <span id="model-name">Model: Loading...</span>
            </div>
        </div>
        
        <div class="messages" id="messages"></div>
        
        <div class="input-area">
            <input 
                type="text" 
                id="input" 
                placeholder="Ask something..."
                autocomplete="off"
            >
            <button id="send" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8002';
        const messagesDiv = document.getElementById('messages');
        const inputField = document.getElementById('input');
        const sendBtn = document.getElementById('send');

        // Check health status
        async function checkHealth() {
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                updateStatus('agent', true);
                document.getElementById('model-name').textContent = `Model: ${data.model}`;
            } catch {
                updateStatus('agent', false);
            }
        }

        function updateStatus(service, online) {
            const statusDot = document.getElementById(`${service}-status`);
            const statusText = document.getElementById(`${service}-text`);
            if (online) {
                statusDot.style.background = '#4caf50';
                statusText.textContent = 'Online';
            } else {
                statusDot.style.background = '#f44336';
                statusText.textContent = 'Offline';
            }
        }

        async function sendMessage() {
            const message = inputField.value.trim();
            if (!message) return;

            // Add user message
            addMessage(message, 'user');
            inputField.value = '';
            sendBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                if (!response.ok) throw new Error('API error');
                
                const data = await response.json();
                addMessage(data.response, 'agent');
            } catch (error) {
                addMessage(`Error: ${error.message}`, 'agent');
            } finally {
                sendBtn.disabled = false;
                inputField.focus();
            }
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.innerHTML = `<div class="content">${escapeHtml(text)}</div>`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Send on Enter
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Initial health check
        checkHealth();
        setInterval(checkHealth, 5000);
    </script>
</body>
</html>
