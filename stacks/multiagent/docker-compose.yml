services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: umbrella_ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama_models:/root/.ollama
      - ./data/ollama:/root/ollama_data
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/127.0.0.1/11434'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    container_name: umbrella_proxy
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:8b
    command: python ollama-openai-proxy.py
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: umbrella_api
    restart: unless-stopped
    depends_on:
      - proxy
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:8b
    command: python agent_api.py
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8001/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    image: node:20-alpine
    container_name: umbrella_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./web:/app
    environment:
      VITE_API_URL: http://localhost:8001
    command: >-
      sh -c "npm install -g http-server && http-server /app --cors -a 0.0.0.0 -p 3000"

networks:
  umbrella_net:
    driver: bridge

volumes:
  ollama_models:
