<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vagary Index Shop | Vacation Wear & Travel Accessories</title>
    <link rel="stylesheet" href="styles/KingDesignCollectiveINC-ui.css">
    <link rel="stylesheet" href="styles/KingDesignCollectiveINC-travel-index.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="KingDesignCollectiveINC-travel-index">
    <header class="travel-header">
        <div class="container">
            <div class="logo-container">
                <img src="images/valgary-index-logo.png" alt="The Vagary Index Logo" class="vagary-logo">
            </div>
            <h1 class="brand-name">The Vagary Index</h1>
            <p class="brand-tagline">250 Countries | Travel Intelligence Platform</p>
        </div>
    </header>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-logo">VAGARY</a>
            <div class="nav-links">
                <a href="index.html">Dashboard</a>
                <a href="countries.html">Countries</a>
                <a href="country.html">Country</a>
                <a href="shop.html" class="active">Shop</a>
            </div>
            <div class="search-container">
                <input type="text" id="shopSearch" placeholder="Search vacation items...">
            </div>
        </div>
    </nav>

    <section class="hero-section">
        <div class="container">
            <h2 class="hero-title">Vagary Index Shop</h2>
            <p class="hero-subtitle">Essential vacation wear and travel accessories curated for every journey</p>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <h2 class="section-title">All Vacation Items</h2>
            <div class="product-grid-vagary" id="shopProductGrid">
                <!-- Products loaded from catalog.json -->
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 The Vagary Index | 250 Countries | Local-Compute Mesh | No Cloud APIs</p>
        </div>
    </footer>

    <script src="app.js"></script>
    <script src="scripts/KingDesignCollectiveINC-ui.js" defer></script>
    <script src="scripts/KingDesignCollectiveINC-travel-index.js" defer></script>
    <script>
        // Load all products from catalog.json
        document.addEventListener('DOMContentLoaded', function() {
            const grid = document.getElementById('shopProductGrid');
            if (!grid) return;

            fetch('catalog.json')
                .then(r => r.json())
                .then(data => {
                    const allProducts = [];
                    const categories = data.products_by_category || {};
                    Object.entries(categories).forEach(([cat, products]) => {
                        products.forEach(p => {
                            p._category = cat;
                            allProducts.push(p);
                        });
                    });

                    renderProducts(allProducts);

                    // Search filter
                    const searchInput = document.getElementById('shopSearch');
                    if (searchInput) {
                        searchInput.addEventListener('input', function() {
                            const term = this.value.toLowerCase();
                            const filtered = allProducts.filter(p =>
                                p.name.toLowerCase().includes(term) ||
                                (p.tags || []).some(t => t.toLowerCase().includes(term)) ||
                                p.category.toLowerCase().includes(term)
                            );
                            renderProducts(filtered);
                        });
                    }
                })
                .catch(err => {
                    grid.innerHTML = '<p style="color: var(--color-text-secondary)">Failed to load products. Please try again.</p>';
                });

            function renderProducts(products) {
                grid.innerHTML = products.map(p => `
                    <div class="vagary-product-card">
                        <img src="${p.image || ''}" alt="${p.name}" class="vagary-product-image" loading="lazy">
                        <div class="vagary-product-info">
                            <span class="vagary-badge">${p._category || p.category}</span>
                            <h3>${p.name}</h3>
                            <p class="vagary-product-price">$${p.price} <span class="vagary-compare">${p.compare_at_price ? '$' + p.compare_at_price : ''}</span></p>
                            <p class="vagary-product-desc">${p.description || ''}</p>
                            <div class="vagary-product-meta">
                                <span>⭐ ${p.rating || '-'} (${p.reviews_count || 0})</span>
                                <span>🚚 ${p.shipping_days || '5-10'} days</span>
                            </div>
                            <button class="cta-button small">Add to Cart</button>
                        </div>
                    </div>
                `).join('');
            }
        });
    </script>
</body>
</html>
